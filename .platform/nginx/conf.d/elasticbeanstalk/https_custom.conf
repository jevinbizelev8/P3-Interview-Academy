# HTTP to HTTPS redirect - ONLY for custom domains (bizelev8.ai)
# Skip redirect for *.elasticbeanstalk.com (no valid SSL certificate)
# Uses variable concatenation to work around nginx's no-nested-if limitation
set $https_redirect 0;
if ($http_x_forwarded_proto = 'http') {
    set $https_redirect "http";
}
if ($host ~* "bizelev8\.ai$") {
    set $https_redirect "${https_redirect}_custom";
}
if ($https_redirect = "http_custom") {
    return 301 https://$host$request_uri;
}

# Security headers
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
