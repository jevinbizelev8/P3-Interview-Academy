# SPA fallback routing for React application
# This file is automatically included in the server block by Elastic Beanstalk
#
# Purpose: Enable client-side routing for React SPA
# - Serves index.html for all routes that don't match static files
# - Allows React Router to handle routing in the browser
# - Fixes 404 errors on direct URL access and page refresh

location / {
    # Try to serve the file directly
    # If not found, try as directory
    # If still not found, serve index.html (SPA fallback)
    try_files $uri $uri/ /index.html =404;
}

# Ensure API routes are proxied to the Express backend
location /api/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_cache_bypass $http_upgrade;
}
