name: Deploy Main to Production (via Staging)

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip test execution'
        required: false
        default: false
        type: boolean
      skip_smoke_tests:
        description: 'Skip smoke tests (not recommended)'
        required: false
        default: false
        type: boolean
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'deployment-scripts/ops-log/**'

env:
  AWS_REGION: ap-southeast-1
  EB_APPLICATION_NAME: p3-interview-academy
  EB_STAGING_ENV: p3-interview-academy-staging
  EB_PRODUCTION_ENV: p3-interview-academy-prod-v2
  RUN_CI_DB_MIGRATION: 'false'

jobs:
  # ============================================================================
  # JOB 1: Run Tests
  # ============================================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    if: github.event.inputs.skip_tests != 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          NPM_CONFIG_PRODUCTION: "false"
          NPM_CONFIG_OPTIONAL: "true"

      - name: Run TypeScript check
        run: npm run check
        env:
          NODE_ENV: test
          NPM_CONFIG_PRODUCTION: "false"

      - name: Run tests
        run: npm run test:run
        env:
          NODE_ENV: test
          NPM_CONFIG_PRODUCTION: "false"

  # ============================================================================
  # JOB 2: Build Application (once for both environments)
  # ============================================================================
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          NPM_CONFIG_PRODUCTION: "false"
          NPM_CONFIG_OPTIONAL: "true"

      - name: Build application
        run: npm run build

      - name: Create deployment bundle
        run: |
          # Timestamp for version tracking
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BUNDLE_NAME="deployment-$TIMESTAMP.zip"

          # Create bundle directory
          mkdir -p deployment-bundle

          # Copy source code and configuration
          cp -r server/ deployment-bundle/
          cp -r client/ deployment-bundle/
          cp -r shared/ deployment-bundle/
          cp -r .ebextensions/ deployment-bundle/

          # Copy package files
          cp package.json deployment-bundle/
          cp package-lock.json deployment-bundle/
          cp .npmrc deployment-bundle/
          cp tsconfig.json deployment-bundle/
          cp vite.config.ts deployment-bundle/
          cp postcss.config.js deployment-bundle/ || echo "No postcss.config.js"

          # Copy ALL built artifacts (backend + frontend)
          mkdir -p deployment-bundle/dist
          cp dist/index.js deployment-bundle/dist/ || { echo "ERROR: Backend build missing!"; exit 1; }
          cp -r dist/public deployment-bundle/dist/ || { echo "ERROR: Frontend build missing!"; exit 1; }

          # Create deployment zip
          (cd deployment-bundle && zip -r "../$BUNDLE_NAME" . -q)

          echo "BUNDLE_NAME=$BUNDLE_NAME" >> "$GITHUB_ENV"
          echo "VERSION_LABEL=main-$TIMESTAMP" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-bundle
          path: ${{ env.BUNDLE_NAME }}
          retention-days: 7

      - name: Save metadata
        run: |
          echo "${{ env.BUNDLE_NAME }}" > bundle-name.txt
          echo "${{ env.VERSION_LABEL }}" > version-label.txt

      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: deployment-metadata
          path: |
            bundle-name.txt
            version-label.txt
          retention-days: 7

  # ============================================================================
  # JOB 3: Deploy to Staging
  # ============================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: staging
      url: http://${{ env.EB_STAGING_ENV }}.eba-wdmrjtn2.ap-southeast-1.elasticbeanstalk.com

    steps:
      - name: Checkout (for migration scripts)
        uses: actions/checkout@v4

      - name: Setup Node.js (for migrations)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (for migrations)
        run: npm ci --omit=optional
        env:
          NPM_CONFIG_PRODUCTION: "false"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run database migration (staging)
        run: |
          echo "🗄️ Running database migration on staging..."
          npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        continue-on-error: false

      - name: Verify migration (staging)
        run: |
          echo "🔍 Verifying database schema..."
          npm run db:migrate:verify
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment-bundle

      - name: Download metadata
        uses: actions/download-artifact@v4
        with:
          name: deployment-metadata

      - name: Load metadata
        run: |
          BUNDLE_NAME=$(cat bundle-name.txt)
          VERSION_LABEL=$(cat version-label.txt)
          echo "BUNDLE_NAME=$BUNDLE_NAME" >> "$GITHUB_ENV"
          echo "VERSION_LABEL=$VERSION_LABEL" >> "$GITHUB_ENV"
          echo "Deploying: $BUNDLE_NAME with version $VERSION_LABEL"

      - name: Upload to S3
        run: |
          aws s3 cp "$BUNDLE_NAME" "s3://elasticbeanstalk-ap-southeast-1-${{ secrets.AWS_ACCOUNT_ID }}/${{ env.EB_APPLICATION_NAME }}/"

      - name: Create application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "${{ env.EB_APPLICATION_NAME }}" \
            --version-label "$VERSION_LABEL-staging" \
            --description "Staging deployment - main branch - $(date)" \
            --source-bundle S3Bucket=elasticbeanstalk-ap-southeast-1-${{ secrets.AWS_ACCOUNT_ID }},S3Key=${{ env.EB_APPLICATION_NAME }}/"$BUNDLE_NAME"

      - name: Deploy to staging environment
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "${{ env.EB_STAGING_ENV }}" \
            --version-label "$VERSION_LABEL-staging"

      - name: Wait for deployment
        run: |
          echo "Waiting for staging deployment to complete..."
          if timeout 600 aws elasticbeanstalk wait environment-updated --environment-name ${{ env.EB_STAGING_ENV }}; then
            echo "✅ Deployment completed successfully"
          else
            echo "⚠️ Deployment wait timed out, checking environment status..."
            ENV_STATUS=$(aws elasticbeanstalk describe-environments \
              --environment-names ${{ env.EB_STAGING_ENV }} \
              --query 'Environments[0].{Status:Status,Health:Health}' --output json)
            echo "Environment Status: $ENV_STATUS"

            STATUS=$(echo "$ENV_STATUS" | jq -r '.Status')
            if [ "$STATUS" = "Ready" ]; then
              echo "✅ Environment is Ready, proceeding"
            else
              echo "❌ Environment is not Ready: $STATUS"
              exit 1
            fi
          fi

      - name: Verify staging deployment
        run: |
          CNAME=$(aws elasticbeanstalk describe-environments \
            --environment-names "${{ env.EB_STAGING_ENV }}" \
            --query 'Environments[0].CNAME' --output text)

          echo "Testing staging health endpoint: http://$CNAME/api/health"

          # Retry health check up to 3 times
          for i in {1..3}; do
            echo "Health check attempt $i..."
            if curl -f --max-time 30 "http://$CNAME/api/health"; then
              echo "✅ Staging deployment verified!"
              echo "STAGING_URL=http://$CNAME" >> "$GITHUB_ENV"
              break
            else
              echo "❌ Health check failed (attempt $i/3)"
              if [ $i -lt 3 ]; then
                echo "Waiting 30 seconds before retry..."
                sleep 30
              else
                echo "⚠️ Health checks failed, but deployment completed"
                exit 1
              fi
            fi
          done

  # ============================================================================
  # JOB 4: Run Smoke Tests on Staging
  # ============================================================================
  smoke-tests:
    name: Run Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.event.inputs.skip_smoke_tests != 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --omit=optional
        env:
          NPM_CONFIG_PRODUCTION: "false"

      - name: Get staging URL
        run: |
          CNAME=$(aws elasticbeanstalk describe-environments \
            --environment-names "${{ env.EB_STAGING_ENV }}" \
            --query 'Environments[0].CNAME' --output text)
          echo "STAGING_URL=http://$CNAME" >> "$GITHUB_ENV"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ env.AWS_REGION }}

      - name: Run smoke tests
        run: |
          echo "🔥 Running smoke tests against: $STAGING_URL"
          npx tsx deployment-scripts/smoke-tests.ts "$STAGING_URL"

      - name: Smoke tests passed
        run: |
          echo "✅ All smoke tests passed!"
          echo "📦 Build is ready for production deployment"
          echo "⏳ Waiting for manual approval to deploy to production..."

  # ============================================================================
  # JOB 5: Deploy to Production (requires manual approval)
  # ============================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, smoke-tests]
    if: always() && needs.build.result == 'success' && (needs.smoke-tests.result == 'success' || needs.smoke-tests.result == 'skipped')
    environment:
      name: Production
      url: http://${{ env.EB_PRODUCTION_ENV }}.eba-wdmrjtn2.ap-southeast-1.elasticbeanstalk.com

    steps:
      - name: Checkout (for migration scripts)
        uses: actions/checkout@v4

      - name: Setup Node.js (for migrations)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (for migrations)
        run: npm ci --omit=optional
        env:
          NPM_CONFIG_PRODUCTION: "false"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create RDS snapshot (production)
        run: |
          echo "📸 Creating RDS snapshot before migration..."
          bash deployment-scripts/backup-rds.sh production
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          NO_WAIT: "true"

      - name: Run database migration (production)
        run: |
          echo "🗄️ Running database migration on production..."
          npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        continue-on-error: false

      - name: Verify migration (production)
        run: |
          echo "🔍 Verifying database schema..."
          npm run db:migrate:verify
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment-bundle

      - name: Download metadata
        uses: actions/download-artifact@v4
        with:
          name: deployment-metadata

      - name: Load metadata
        run: |
          BUNDLE_NAME=$(cat bundle-name.txt)
          VERSION_LABEL=$(cat version-label.txt)
          echo "BUNDLE_NAME=$BUNDLE_NAME" >> "$GITHUB_ENV"
          echo "VERSION_LABEL=$VERSION_LABEL" >> "$GITHUB_ENV"
          echo "Deploying to production: $BUNDLE_NAME with version $VERSION_LABEL"

      - name: Verify S3 bundle exists
        run: |
          aws s3 ls "s3://elasticbeanstalk-ap-southeast-1-${{ secrets.AWS_ACCOUNT_ID }}/${{ env.EB_APPLICATION_NAME }}/$BUNDLE_NAME" || {
            echo "Bundle not found in S3, re-uploading..."
            aws s3 cp "$BUNDLE_NAME" "s3://elasticbeanstalk-ap-southeast-1-${{ secrets.AWS_ACCOUNT_ID }}/${{ env.EB_APPLICATION_NAME }}/"
          }

      - name: Create production application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "${{ env.EB_APPLICATION_NAME }}" \
            --version-label "$VERSION_LABEL-production" \
            --description "Production deployment - main branch - $(date)" \
            --source-bundle S3Bucket=elasticbeanstalk-ap-southeast-1-${{ secrets.AWS_ACCOUNT_ID }},S3Key=${{ env.EB_APPLICATION_NAME }}/"$BUNDLE_NAME"

      - name: Deploy to production environment
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "${{ env.EB_PRODUCTION_ENV }}" \
            --version-label "$VERSION_LABEL-production"

      - name: Wait for deployment
        run: |
          echo "Waiting for production deployment to complete..."
          timeout 900 aws elasticbeanstalk wait environment-updated --environment-name ${{ env.EB_PRODUCTION_ENV }}

      - name: Verify production deployment
        run: |
          # Check environment status
          aws elasticbeanstalk describe-environments \
            --environment-names ${{ env.EB_PRODUCTION_ENV }} \
            --query 'Environments[0].{Status:Status,Health:Health,VersionLabel:VersionLabel}'

          # Test health endpoint
          CNAME=$(aws elasticbeanstalk describe-environments \
            --environment-names ${{ env.EB_PRODUCTION_ENV }} \
            --query 'Environments[0].CNAME' --output text)

          echo "Testing production health endpoint: http://$CNAME/api/health"
          curl -f "http://$CNAME/api/health" || (echo "Production health check failed" && exit 1)

          echo "✅ Production deployment verified successfully!"

      - name: Post-deployment cleanup
        if: success()
        run: |
          # Clean up old application versions (keep last 10)
          aws elasticbeanstalk describe-application-versions \
            --application-name ${{ env.EB_APPLICATION_NAME }} \
            --query 'ApplicationVersions[10:].VersionLabel' --output text | \
          xargs -I {} aws elasticbeanstalk delete-application-version \
            --application-name ${{ env.EB_APPLICATION_NAME }} \
            --version-label {} --delete-source-bundle || echo "No old versions to clean"

  # ============================================================================
  # JOB 6: Deployment Summary
  # ============================================================================
  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-staging, smoke-tests, deploy-production]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "# 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Workflow Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Staging Deployment**: ${{ needs.deploy-staging.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Smoke Tests**: ${{ needs.smoke-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Production Deployment**: ${{ needs.deploy-production.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.deploy-production.result }}" == "success" ]; then
            echo "✅ **All deployments successful!**" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.deploy-production.result }}" == "skipped" ]; then
            echo "⏸️ **Production deployment skipped or pending approval**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Deployment failed - check logs above**" >> $GITHUB_STEP_SUMMARY
          fi
