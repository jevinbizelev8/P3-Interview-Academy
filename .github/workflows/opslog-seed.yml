name: Seed Ops Log (Monthly)

on:
  schedule:
    - cron: "0 0 1 * *" # 1st of every month at 00:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Seed current month ops log
        run: npx tsx deployment-scripts/ops-log/seed-ops-log.ts

      - name: Commit changes if any
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add -A
            git commit -m "chore(ops-log): seed monthly ops log"
            git push
          else
            echo "No changes to commit"
          fi
